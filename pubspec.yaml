name: subnest
description: "Subnest: Subscription Tracker — offline-first, no account, EN + VI."
publish_to: 'none'

# versionName+versionCode. Bump on every store upload; tag releases as vX.Y.Z.
version: 1.0.0

environment:
  sdk: ^3.13.7

# Only the Core session (A) and the Design-system session (F) may edit dependencies.
# Other sessions: write the package you need into your notes/ report instead.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2

  # Persistence
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1

  # Reminders
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # Formatting / l10n
  intl: ^0.20.3

  # Insights charts (used by the Insights UI session)
  fl_chart: ^1.3.0

  # Backup / restore
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  # Auto backup (1.0): SHA-256 checksum, AES-256-GCM + PBKDF2 envelopes, password in Keystore/Keychain.
  crypto: ^3.0.8
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0

  # Exchange rates
  http: ^1.6.0

  # Icons — Lucide (ISC) as an icon font, tree-shaken in release builds (design-system session F).
  # Pinned: versions newer than 2 weeks are not adopted automatically.
  lucide_icons_flutter: 4.0.1

  # Misc
  uuid: ^4.6.0
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.3

  # 1.0 expansion (M1, 2026-11-06) — see notes/2026-11-06-m1-core.md for licences.
  # On-device OCR for S13 screenshot scan (Latin script; nothing leaves the phone). Pinned: 1.0.0 was
  # published 2026-11-05 (< 2 weeks). iOS: ML Kit needs platform :ios 15.5+ in ios/Podfile (session S/W).
  google_mlkit_text_recognition: 0.17.1
  # Pick screenshots / take a receipt photo (Android photo picker: no storage permission).
  image_picker: ^1.2.4
  # Custom logo (session L, 2026-11-10): turn on the Android Photo Picker (no storage permission).
  # Same versions the lock file already resolves through image_picker.
  image_picker_android: ^0.8.13+25
  image_picker_platform_interface: ^2.11.2
  # Home-screen widgets (S11, session W).
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  # App icon + splash generators (design-system session F). Sources: assets/icons/brand/ (see make_brand_assets.py).
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/brand/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#0e6b63"
  adaptive_icon_foreground: assets/icons/brand/app_icon.png
  adaptive_icon_foreground_inset: 8

# dart run flutter_native_splash:create — light: brand fill + mark + word; dark: bg so launch never flashes.
flutter_native_splash:
  color: "#0e6b63"
  image: assets/icons/brand/splash_light.png
  color_dark: "#0d1113"
  image_dark: assets/icons/brand/splash_dark.png
  android_12:
    color: "#0e6b63"
    image: assets/icons/brand/splash_android12.png
    icon_background_color: "#0e6b63"
    color_dark: "#0d1113"
    image_dark: assets/icons/brand/splash_android12.png
    icon_background_color_dark: "#0e6b63"
  ios_content_mode: center
  web: false

flutter:
  uses-material-design: true
  # gen-l10n: ARB parts live in lib/l10n/parts/ and are merged by tool/merge_arb.dart (see docs/dev.md).
  generate: true

  # Be Vietnam Pro (OFL 1.1) bundled — no runtime font download (the app only calls the rates API).
  # TTFs carry an added `tnum` feature (assets/fonts/BeVietnamPro/add_tnum.py) for tabular money.
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Bold.ttf
          weight: 700

  assets:
    # Service catalog — owned by the Catalog session (B). Format: assets/catalog/README.md.
    - assets/catalog/
    # Real logos of Catalog services, bundled (no network): tool/fetch_logos.py; sources in
    # assets/logos/SOURCES.md (that folder itself is not bundled — only png/).
    - assets/logos/png/

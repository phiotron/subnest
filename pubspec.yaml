name: subnest
description: "Subnest: Subscription Tracker — offline-first, no account, EN + VI."
publish_to: 'none'

# versionName+versionCode. Bump on every store upload; tag releases as vX.Y.Z.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Only the Core session (A) and the Design-system session (F) may edit dependencies.
# Other sessions: write the package you need into your notes/ report instead.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2

  # Persistence
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1

  # Reminders
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # Formatting / l10n
  intl: ^0.20.3

  # Insights charts (used by the Insights UI session)
  fl_chart: ^1.3.0

  # Backup / restore
  share_plus: ^13.3.1
  file_picker: ^13.3.2

  # Exchange rates
  http: ^1.6.0

  # Misc
  uuid: ^4.6.0
  collection: ^1.19.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  # gen-l10n: ARB parts live in lib/l10n/parts/ and are merged by tool/merge_arb.dart (see docs/dev.md).
  generate: true

  assets:
    # Service catalog — owned by the Catalog session (B). Format: assets/catalog/README.md.
    - assets/catalog/

# CI: checks + signed release AAB (Android). See docs/ci.md.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'store/**', 'design/**', 'notes/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true          # Flutter SDK + pub cache

      - uses: gradle/actions/setup-gradle@v4   # Gradle cache

      - name: pub get
        run: flutter pub get

      - name: ARB parts merged (tool/merge_arb.dart --check)
        run: dart run tool/merge_arb.dart --check

      - name: Generated code up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Signing config (from secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "::error::Signing secrets missing - run .github/scripts/set-android-secrets.sh (docs/ci.md section 2)."
              exit 1
            fi
            echo "::warning::No signing secrets on this PR - AAB will be signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > "$RUNNER_TEMP/key.properties"
          echo "ANDROID_KEY_PROPERTIES=$RUNNER_TEMP/key.properties" >> "$GITHUB_ENV"
          # On main, an unsigned (debug-key) AAB must never be produced silently.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "REQUIRE_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          fi

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Verify AAB signature
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          ls -l "$AAB"
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256:" || true

      - name: Clean up signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" "$RUNNER_TEMP/key.properties"

      - uses: actions/upload-artifact@v4
        with:
          name: subnest-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

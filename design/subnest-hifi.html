.scroll::-webkit-scrollbar { display: none; }

/* Tab bar */

/* FAB */

  display: grid; place-items: center; background: var(--brand); color: var(--on-brand); box-shadow: var(--shadow-float); }

/* ---------- Generic pieces ---------- */
.card { display: block; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
.icon-btn { width: 44px; height: 44px; border-radius: var(--radius-full); display: grid; place-items: center; color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--button-h); padding: 0 var(--space-5);
  border-radius: var(--radius-md); font-size: 16px; line-height: 20px; font-weight: 600; white-space: nowrap; }

.btn.block { width: 100%; }
.btn-primary { background: var(--brand); color: var(--on-brand); }
.btn-tonal { background: var(--brand-soft); color: var(--on-brand-soft); }
.btn-outline { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.btn-text { background: transparent; color: var(--brand); }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--radius-full); background: var(--surface-2);
  color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap; }
.chip.on { background: var(--brand); color: var(--on-brand); font-weight: 600; }
.badge-warn { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px 0 6px; border-radius: var(--radius-full);
  background: var(--warning-soft); color: var(--warning-ink); font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; }
.link { color: var(--brand); }
.eyebrow { text-transform: uppercase; color: var(--ink-muted); }

/* ---------- S2 Overview ---------- */
.top { display: flex; align-items: flex-end; justify-content: space-between; padding-top: var(--space-2); }

.hero { padding: var(--space-6) 0 var(--space-5); }

.stack { display: flex; flex-direction: column; gap: var(--space-3); }
.card-warn { display: flex; align-items: center; gap: var(--space-3); padding: 14px var(--space-4); background: var(--warning-soft); box-shadow: none; }
.warn-ic { width: 36px; height: 36px; flex: none; border-radius: var(--radius-full); display: grid; place-items: center; background: var(--surface); color: var(--warning-ink); }
.warn-sub { color: var(--warning-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-btn { display: inline-flex; align-items: center; gap: 2px; height: 36px; padding: 0 14px; border-radius: var(--radius-full); font-size: 14px; font-weight: 600; flex: none; }
.chip-btn.warn { background: var(--surface); color: var(--warning-ink); }
.card-trial { padding: var(--space-4); }
.trial-top { position: relative; display: flex; gap: var(--space-3); align-items: center; }
.trial-badge { position: absolute; left: 26px; top: 26px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
  background: var(--warning-soft); color: var(--warning-ink); box-shadow: 0 0 0 2px var(--surface); }
.trial-actions { display: flex; gap: var(--space-2); margin: var(--space-3) 0 0 52px; }
.sec { margin-top: var(--space-6); }
.sec-head { display: flex; align-items: center; justify-content: space-between; min-height: 32px; margin-bottom: var(--space-3); }
.sec-head h2 { margin: 0; }
.sort { display: inline-flex; align-items: center; gap: 6px; height: 36px; color: var(--ink-muted); }
.up-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.up { padding: 14px; display: flex; flex-direction: column; gap: 0; }
.up .tile { margin-bottom: 10px; }
.up-amt { margin-top: 10px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; margin-bottom: var(--space-3); border-radius: var(--radius-md); background: var(--surface-2); }
.seg button { height: 36px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; color: var(--ink-muted); white-space: nowrap; }
.seg button b { font-weight: 500; opacity: .85; margin-left: 2px; }
.seg button.on { background: var(--brand-soft); color: var(--on-brand-soft); }
.list { padding: 4px 0; }
.row { position: relative; display: flex; align-items: center; gap: var(--space-3); min-height: var(--row-h); padding: 12px var(--space-4); }
.row + .row::before { content: ""; position: absolute; top: 0; left: 68px; right: 0; height: 1px; background: var(--line); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
.share { flex: none; display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--ink-muted); }
.row-sub { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; }

/* ---------- S4 Form ---------- */
.nav { position: absolute; z-index: 3; top: 50px; left: 0; right: 0; height: 52px; display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; padding: 0 4px; background: var(--bg); }
.nav h1 { margin: 0; text-align: center; }
.form { position: absolute; inset: 102px 0 0; overflow-y: auto; padding: var(--space-2) var(--space-4) 140px; scrollbar-width: none; }
.form::-webkit-scrollbar { display: none; }
.f-head { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-2) 0 var(--space-5); }
.f-head .tile-wrap { position: relative; }
.edit-dot { position: absolute; right: -4px; bottom: -4px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line), var(--shadow-card); }
.plan-chip { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px 0 10px; margin-top: 4px; border-radius: var(--radius-full); background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--ink); }
.group { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); margin-bottom: var(--space-3); }
.field { position: relative; padding: 14px var(--space-4); }
.field + .field::before { content: ""; position: absolute; top: 0; left: var(--space-4); right: 0; height: 1px; background: var(--line); }
.f-label { display: block; margin-bottom: 6px; }
.f-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: 32px; }
.price-row { display: flex; align-items: center; gap: var(--space-3); }
.price-row .amount-lg { flex: 1; display: flex; align-items: center; }
.caret { width: 2px; height: 32px; margin-left: 2px; background: var(--brand); border-radius: 1px; }
.cur-btn { display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 10px 0 14px; border-radius: var(--radius-full); background: var(--surface-2); font-size: 15px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chips.fit { display: grid; grid-template-columns: repeat(4, 1fr); }
.chips.fit { gap: 6px; }
.chips.fit .chip { justify-content: center; padding: 0 4px; font-size: 13px; }
.every { display: inline-flex; align-items: center; gap: var(--space-2); }
.mini-field { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 10px; border-radius: var(--radius-sm); background: var(--surface-2); font-weight: 600; }
.toggle { flex: none; position: relative; width: 52px; height: 32px; border-radius: var(--radius-full); background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--line-strong); }
.toggle::after { content: ""; position: absolute; top: 8px; left: 8px; width: 16px; height: 16px; border-radius: 50%; background: var(--line-strong); }
.toggle.on { background: var(--brand); box-shadow: none; }
.toggle.on::after { left: 24px; top: 4px; width: 24px; height: 24px; background: var(--on-brand); }
.stepper { display: inline-flex; align-items: center; gap: 4px; padding: 4px; border-radius: var(--radius-full); background: var(--surface-2); }
.stepper button { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-card); }
.stepper .v { min-width: 28px; text-align: center; font-weight: 700; font-size: 17px; }
.share-panel { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-top: var(--space-3); padding: 12px 14px;
  border-radius: var(--radius-md); background: var(--brand-soft); color: var(--on-brand-soft); }
.share-panel .big { font-size: 20px; line-height: 26px; font-weight: 700; }
.seg5 { display: grid; grid-template-columns: repeat(5, 1fr); padding: 4px; border-radius: var(--radius-md); background: var(--surface-2); }
.seg5 button { height: 36px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; color: var(--ink-muted); white-space: nowrap; }
.seg5 button.on { background: var(--brand-soft); color: var(--on-brand-soft); }
.bottom-bar { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; padding: 12px var(--space-4) 34px; background: var(--surface); box-shadow: 0 -1px 0 var(--line); }

/* ---------- S6 Confirm sheet ---------- */
.dim { position: absolute; inset: 0; z-index: 6; background: var(--scrim); }
.sheet { position: absolute; z-index: 7; left: 0; right: 0; bottom: 0; padding: 8px var(--space-5) 34px; border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  background: var(--surface-sheet); box-shadow: var(--shadow-float); }
.grabber { width: 36px; height: 5px; border-radius: 3px; margin: 0 auto var(--space-4); background: var(--line-strong); opacity: .5; }
.sh-head { display: flex; gap: var(--space-3); align-items: center; }
.sh-head h2 { margin: 0; }
.amount-box { margin: var(--space-5) 0 var(--space-3); padding: 14px var(--space-4); border-radius: var(--radius-md); background: var(--surface-2); }
.amount-box .f-row { min-height: 40px; }
.next-note { display: flex; align-items: center; gap: var(--space-2); margin: 0 0 var(--space-5); color: var(--ink-muted); }
.sh-actions { display: flex; flex-direction: column; gap: var(--space-2); }
.done { display: none; text-align: center; padding: var(--space-4) 0 0; }
.sheet.is-done .done { display: block; }
.sheet.is-done .ask { display: none; }
.check { width: 72px; height: 72px; margin: 0 auto var(--space-4); border-radius: 50%; display: grid; place-items: center; background: var(--success-soft); color: var(--success); }
.check svg { stroke-dasharray: 30; stroke-dashoffset: 30; }
.sheet.is-done .check svg { animation: sn-draw 250ms 80ms ease-out forwards; }
.sheet.is-done .check { animation: sn-pop 220ms ease-out; }
@keyframes sn-draw { to { stroke-dashoffset: 0; } }
@keyframes sn-pop { from { transform: scale(.7); } to { transform: scale(1); } }
.paid-pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: var(--radius-full); background: var(--success-soft); color: var(--success); font-size: 13px; font-weight: 600; }

/* ---------- Preview stage (light + dark side by side) ---------- */
.stage { display: flex; gap: 40px; padding: 24px 32px 32px; background: transparent; font-family: var(--font-sans); }
.stage-col { display: flex; flex-direction: column; gap: 12px; }
.stage-cap { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink-muted); font-family: var(--font-sans); }

/* =====================================================================
   v2 — components and screens S0–S12, prototypes
   ===================================================================== */
.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px 0 6px; border-radius: var(--radius-full);
  font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; flex: none; }
.badge-neutral { background: var(--surface-2); color: var(--ink-muted); }
.badge-success { background: var(--success-soft); color: var(--success); }
.warn-t { color: var(--warning-ink); font-weight: 600; }
.danger-t { color: var(--danger) !important; }
.inl { display: inline-block; vertical-align: -2px; }
.mt8 { margin-top: var(--space-2); } .mt16 { margin-top: var(--space-4); }
.btn[disabled], .btn.is-disabled { opacity: .45; }
.display-sm { font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

/* nav-led screens */
.nav ~ .scroll { inset: 102px 0 0; }
.nav-clear { background: transparent; }
.pad { margin-top: var(--space-4); }
.list-note { margin: var(--space-2) var(--space-1) 0; }
.list-empty { padding: var(--space-5) var(--space-4); text-align: center; }
.grp-head { display: block; margin: var(--space-6) var(--space-1) var(--space-2); }
.group .srow + .srow::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; height: 1px; background: var(--line); }
.srow { position: relative; display: flex; align-items: center; gap: var(--space-3); min-height: 56px; padding: 10px var(--space-4); }
.srow-ic { width: 24px; flex: none; color: var(--ink-muted); display: grid; place-items: center; }
.srow-l { font-size: 15px; line-height: 20px; font-weight: 500; }
.srow-v { color: var(--ink-muted); font-size: 15px; text-align: right; white-space: nowrap; }
.srow-v b { color: var(--ink); font-weight: 600; }
.srow.danger .srow-l, .srow.danger .srow-ic { color: var(--danger); }
.srow.sel { background: transparent; }
.check-c { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: var(--on-brand); flex: none; }
.cur-badge { width: 36px; height: 36px; flex: none; border-radius: var(--radius-md); display: grid; place-items: center; background: var(--surface-2); font-weight: 700; font-size: 15px; }

/* banner */
.banner { display: flex; align-items: flex-start; gap: var(--space-3); padding: 14px var(--space-4); border-radius: var(--radius-lg); }
.banner .grow { gap: 2px; }
.banner-ic { flex: none; margin-top: 1px; }
.banner-act { flex: none; align-self: center; height: 36px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: var(--radius-full); font-size: 14px; font-weight: 600; background: var(--surface); cursor: pointer; }
.banner-warn { background: var(--warning-soft); color: var(--warning-ink); }
.banner-warn .label { color: var(--ink); } .banner-warn .banner-body { color: var(--warning-ink); }
.banner-success { background: var(--success-soft); color: var(--success); }
.banner-success .label { color: var(--ink); } .banner-success .banner-body { color: var(--success); }
.banner-info { background: var(--brand-soft); color: var(--on-brand-soft); }
.banner-neutral { background: var(--surface); color: var(--ink-muted); box-shadow: var(--shadow-card); }
.banner-neutral .label { color: var(--ink); } .banner-neutral .banner-act { background: var(--brand-soft); color: var(--on-brand-soft); }
.banner-danger { background: var(--danger-soft); color: var(--danger); }
.top-banner { margin-top: var(--space-4); }

/* empty state */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--space-8) var(--space-4) var(--space-6); gap: var(--space-2); }
.empty h2 { margin: var(--space-4) 0 0; }
.empty p { margin: 0 0 var(--space-4); max-width: 290px; }
.hero-num.zero { color: var(--ink-muted); }

/* illustration (tokens) */
.art .a-rim { fill: var(--on-brand-soft); opacity: .35; }
.art .a-bowl { fill: var(--brand); }
.art .a-weave { fill: none; stroke: var(--on-brand); stroke-opacity: .28; stroke-width: 3; stroke-linecap: round; }
.art .a-dash { fill: none; stroke: var(--line-strong); stroke-width: 2; stroke-dasharray: 5 4; }
.art .a-plus { stroke: var(--line-strong); stroke-width: 2.5; stroke-linecap: round; }
.art .a-spark.w, .art .a-dot.w { fill: var(--warning); }
.art .a-spark.b, .art .a-dot.b { fill: var(--brand); }
.art .a-bar { fill: var(--brand); } .art .a-bar.soft { fill: var(--on-brand-soft); opacity: .5; }

/* dialog, sheet, toast */
.dialog { position: absolute; z-index: 8; left: 24px; right: 24px; top: 50%; transform: translateY(-50%); padding: var(--space-6) var(--space-5) var(--space-4); border-radius: var(--radius-xl);
  background: var(--surface-sheet); box-shadow: var(--shadow-float); animation: sn-dlg 200ms ease-out; }
.dialog h2 { margin: 0 0 var(--space-2); }
.dlg-body { margin-bottom: var(--space-5); }
.dlg-actions { display: flex; flex-direction: column; gap: var(--space-1); }
.dlg-list { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 10px 0; padding: 12px 14px; border-radius: var(--radius-md); background: var(--surface-2); color: var(--ink); }
.dlg-opts { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; color: var(--ink); }
.sheet { animation: sn-up 240ms cubic-bezier(.2,.8,.2,1); max-height: 760px; }
.sheet.tall { top: 120px; display: flex; flex-direction: column; }
.sh-title { margin: 0 0 var(--space-4); }
.sh-note { margin: var(--space-3) 0 var(--space-4); }
.dim { animation: sn-fade 200ms ease-out; }
.toast { position: absolute; z-index: 9; left: 16px; right: 84px; bottom: 112px; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: var(--radius-md);
  background: var(--ink); color: var(--bg); font-size: 14px; line-height: 20px; font-weight: 500; box-shadow: var(--shadow-float); animation: sn-up 260ms ease-out; }
@keyframes sn-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes sn-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sn-dlg { from { opacity: 0; transform: translateY(-50%) scale(.94); } to { opacity: 1; transform: translateY(-50%) scale(1); } }
@media (prefers-reduced-motion: reduce) { .sheet, .dim, .toast, .dialog, .phone.enter, .cf, .row.is-new { animation: none !important; } }

/* search, keyboard, chips row */
.search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: var(--radius-md); background: var(--surface-2); color: var(--ink-muted); }
.search.focus { box-shadow: inset 0 0 0 2px var(--brand); background: var(--surface); }
.search-ph { color: var(--ink-muted); font-size: 16px; }
.search-q { color: var(--ink); font-size: 16px; font-weight: 500; }
.search-x { margin-left: auto; color: var(--ink-muted); }
.caret.sm { width: 2px; height: 22px; background: var(--brand); border-radius: 1px; margin: 0 -8px 0 -2px; }
.kb { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; padding: 8px 3px 40px; background: var(--surface-2); box-shadow: 0 -1px 0 var(--line); }
.kb-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 11px; }
.kb-k { flex: 0 0 32px; height: 42px; border-radius: 6px; display: grid; place-items: center; background: var(--surface); color: var(--ink); font-size: 19px; box-shadow: 0 1px 0 var(--line-strong); }
.kb-w { flex-basis: 44px; font-size: 14px; background: var(--line); }
.kb-sp { flex: 1 1 auto; max-width: 190px; font-size: 14px; }
.kb-go { flex-basis: 88px; background: var(--brand); color: var(--on-brand); }
.chip-row { display: flex; gap: var(--space-2); overflow-x: auto; margin: var(--space-3) calc(-1 * var(--space-4)) 0; padding: 0 var(--space-4) 2px; scrollbar-width: none; }
.chip-row::-webkit-scrollbar { display: none; }

/* S3 library */
.lib { position: absolute; inset: 102px 0 0; padding: var(--space-2) var(--space-4) 0; overflow: hidden; }

/* S11 home screen + widgets */

/* S12 lock screen */
.phone.is-lock { background: linear-gradient(170deg, #0e6b63 0%, #0b3a40 60%, #121a2e 100%); }
.lock { position: absolute; inset: 50px 12px 0; display: flex; flex-direction: column; align-items: center; color: #fff; }
.lock-d { margin-top: 24px; font-size: 18px; font-weight: 600; opacity: .9; }
.lock-t { font-size: 88px; line-height: 96px; font-weight: 700; letter-spacing: -0.03em; }
.lock-list { width: 100%; margin-top: auto; margin-bottom: 110px; display: flex; flex-direction: column; gap: 8px; }
.notif.glass { background: color-mix(in srgb, var(--surface-sheet) 82%, transparent); backdrop-filter: blur(20px); }
.notif.glass.first { cursor: pointer; }

/* ---------- Prototype frame ---------- */
.proto { display: flex; gap: 36px; padding: 24px 32px; font-family: var(--font-sans); color: var(--ink); }
.proto-phone { flex: none; }
.phone.enter { animation: sn-fade 180ms ease-out; }
.proto-side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.proto-side h2 { margin: 0; font-size: 22px; line-height: 28px; }
.proto-side p { margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
.proto-steps { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: st; display: flex; flex-direction: column; gap: 6px; }
.proto-steps li { counter-increment: st; }
.proto-steps button { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 10px; text-align: left; font-size: 14px; font-weight: 500; color: var(--ink-muted); background: var(--surface-2); }
.proto-steps button::before { content: counter(st); width: 22px; height: 22px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface); color: var(--ink-muted); }
.proto-steps button.br { margin-left: 22px; width: calc(100% - 22px); }
.proto-steps button.seen { color: var(--ink); }
.proto-steps button.on { background: var(--brand-soft); color: var(--on-brand-soft); font-weight: 700; }
.proto-steps button.on::before { background: var(--brand); color: var(--on-brand); }
.proto-ctl { display: flex; gap: 8px; margin-top: 4px; }
.pb { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: var(--radius-full); box-shadow: inset 0 0 0 1.5px var(--line-strong); font-size: 14px; font-weight: 600; }
.proto-opt { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-muted); }
.proto-opt input { width: 18px; height: 18px; accent-color: var(--brand); }
.proto-theme .seg-mini { display: inline-flex; }
.proto-hint { font-weight: 600; color: var(--ink) !important; }
.live { cursor: pointer; }
.hot { outline: 2px dashed var(--focus) !important; outline-offset: 2px; animation: sn-hot 1.6s ease-in-out infinite; border-radius: 12px; }
@keyframes sn-hot { 0%, 100% { outline-color: var(--focus); } 50% { outline-color: transparent; } }

/* ---------- Component preview panes ---------- */
.cpanes { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 24px 32px; font-family: var(--font-sans); }
.cpane { background: var(--bg); color: var(--ink); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 0 0 1px var(--line); }
.cpane .h { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--ink-muted); }
.cpane .r { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.cpane .sheet, .cpane .dialog, .cpane .toast { position: relative; inset: auto; transform: none; left: auto; right: auto; top: auto; bottom: auto; animation: none; }

/* detail: transparent nav over the colour-washed hero */
.nav-clear ~ .scroll.detail { top: 50px; }
.nav-clear ~ .scroll.detail .hero-d { padding-top: 64px; }

/* ---------- 360 × 800 (small Android) ---------- */
.phone.s360 { width: 360px; height: 800px; border-radius: 40px; }
.phone.s360 .sb { padding: 6px 22px 0 34px; }
.phone.s360 .sb-island { width: 22px; height: 22px; margin-left: -11px; top: 14px; border-radius: 50%; }
.phone.s360 .display { font-size: 36px; line-height: 44px; }
.file-n { word-break: break-all; }
.nowrap { white-space: nowrap; }
.nav-clear.solid { background: var(--bg); box-shadow: 0 1px 0 var(--line); }
.hero-sub { flex-wrap: wrap; row-gap: 2px; }
.hero-sub span { white-space: nowrap; }
.trial-top .tile-wrap { position: relative; flex: none; }
.trial-top .tile-wrap .trial-badge { left: 26px; top: 26px; }
.banner { flex-wrap: wrap; row-gap: 10px; }
.banner > .grow { flex: 1 1 170px; }
.banner-act { margin-left: auto; }
.cal-bar { flex-wrap: wrap; gap: 4px 8px; }
.wg-it .grow { min-width: 0; }
.wg-in { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wg-ia { flex: none; }
.row-amt .title-sm, .row-amt .meta { white-space: nowrap; }

/* =====================================================================
   v3 — swipe actions, sheets, OS prompt
   ===================================================================== */
.swipe { position: relative; overflow: hidden; }
.swipe + .row::before, .row + .swipe::before { content: ""; position: absolute; z-index: 1; top: 0; left: 68px; right: 0; height: 1px; background: var(--line); }
.swipe-acts { position: absolute; inset: 0; display: flex; justify-content: flex-end; }
.sw-act { width: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; }
.sw-act.ok { background: var(--brand); color: var(--on-brand); }
.sw-act.no { background: var(--surface-2); color: var(--ink); box-shadow: inset 1px 0 0 var(--line); }
.row.swiped { background: var(--surface); transform: translateX(-84px); box-shadow: 1px 0 0 var(--line); }
.row.swiped.two { transform: translateX(-168px); }
.sh-gap { height: var(--space-4); }
.rot { transform: rotate(180deg); }
.input { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: var(--radius-md); background: var(--surface-2); color: var(--ink); font-size: 15px; box-shadow: inset 0 0 0 1px var(--line); }
.input.tall { align-items: flex-start; padding: 12px 14px; min-height: 84px; line-height: 21px; }
.f-hint { display: block; margin-top: 6px; } .f-hint.right { text-align: right; }
.tile-prev { display: flex; gap: var(--space-4); align-items: center; margin-bottom: var(--space-4); }
.tile-row { display: flex; align-items: center; gap: var(--space-3); margin-top: 8px; padding: 10px 12px; border-radius: var(--radius-md); background: var(--surface-2); }
.tile-row .grow { gap: 0; }
.letters { display: inline-flex; align-items: center; gap: 10px; }
.letters .mini-field { font-size: 17px; min-width: 64px; }
.swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-bottom: 10px; }
.swatch { aspect-ratio: 1; border-radius: var(--radius-tile-40); background: var(--sw); display: grid; place-items: center; color: #fff; box-shadow: inset 0 0 0 1px var(--tile-ring); }
.swatch.on { box-shadow: 0 0 0 2px var(--surface-sheet), 0 0 0 4px var(--focus); }
.emojis { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.emo { aspect-ratio: 1; display: grid; place-items: center; border-radius: var(--radius-md); background: var(--surface-2); font-size: 20px; }
.sheet.tall { overflow-y: auto; scrollbar-width: none; }
.cat-head { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
.cat-head h2 { margin: 0; } .cat-head .grow { gap: 0; }
.cat-sw { width: 14px; height: 40px; border-radius: 4px; flex: none; }
.list.flat { box-shadow: inset 0 0 0 1px var(--line); margin-bottom: var(--space-3); }
.os-alert { position: absolute; z-index: 8; left: 50%; top: 50%; width: 270px; margin-left: -135px; transform: translateY(-50%); border-radius: 14px; overflow: hidden; text-align: center;
  background: #f2f2f2eb; color: #000; backdrop-filter: blur(20px); font-family: -apple-system, "SF Pro Text", var(--font-sans); animation: sn-fade 200ms ease-out; }
[data-theme="dark"] .os-alert { background: #252525eb; color: #fff; }
.os-body { display: flex; flex-direction: column; gap: 4px; padding: 18px 16px 16px; font-size: 13px; line-height: 17px; }
.os-body b { font-size: 17px; line-height: 22px; font-weight: 600; }
.os-btns { display: grid; grid-template-columns: 1fr 1fr; border-top: 0.5px solid #3c3c435c; }
.os-btns span { height: 44px; display: grid; place-items: center; color: #007aff; font-size: 17px; }
.os-btns span + span { border-left: 0.5px solid #3c3c435c; }
[data-theme="dark"] .os-btns span { color: #0a84ff; }
.os-note { position: absolute; z-index: 8; left: 24px; right: 24px; bottom: 60px; padding: 10px 12px; border-radius: var(--radius-md); background: var(--surface-sheet); color: var(--ink-muted); text-align: center; }

/* large-text layout rules: let lines wrap instead of clipping */
.sort, .mini-field, .srow-l, .badge { white-space: nowrap; }
.sec-head { flex-wrap: wrap; gap: 4px 12px; }
.srow-v { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.phone.t130 .row-sub { flex-wrap: wrap; white-space: normal; overflow: visible; row-gap: 4px; }
.phone.t130 .f-row { flex-wrap: wrap; row-gap: 8px; }
.phone.t130 .row.pend .row-main .meta { white-space: nowrap; }
.phone.t130 .srow-v { white-space: normal; max-width: 52%; }

/* =====================================================================
   v4 — product.md §10: progress, labels, budget, week, filter, pause, worth,
   forecast, organize, automation, scan, widgets v2
   ===================================================================== */
.pbar { display: block; height: 4px; margin-top: 7px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.pbar i { display: block; height: 100%; border-radius: 2px; background: var(--brand); }

.pbar.trial i { background: var(--ink-muted); }
.lbl { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px 0 6px; border-radius: var(--radius-full); background: var(--surface-2); color: var(--ink); font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; flex: none; }
.lbl i { width: 8px; height: 8px; border-radius: 50%; }
.lbls { display: inline-flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.auto-b { flex: none; display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 7px 0 5px; border-radius: var(--radius-full); background: var(--brand-soft); color: var(--on-brand-soft); font-size: 11px; font-weight: 700; letter-spacing: .01em; vertical-align: 2px; }
.budget { margin: var(--space-4) 0 var(--space-2); cursor: pointer; }
.bud-bar { height: 10px; border-radius: var(--radius-full); background: var(--surface-2); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.bud-fill { display: flex; gap: 2px; height: 100%; }
.bud-fill span { box-shadow: inset 0 0 0 1px var(--tile-ring); }

.budget.over .bud-pct { color: var(--danger); font-weight: 700; }
.budget.over .bud-bar { box-shadow: inset 0 0 0 2px var(--danger); }
.wk { padding: 14px var(--space-4) 12px; }
.wk-head { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 10px; }
.wk-head .grow { gap: 2px; }
.wk-wait { white-space: nowrap; }
.wk-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wk-d { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 8px; border-radius: 12px; }

.wk-w { font-size: 11px; font-weight: 600; color: var(--ink-muted); text-transform: uppercase; }

.wk-n { font-size: 15px; font-weight: 700; }
.wk-t { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 26px; margin-top: 4px; }
.wk-t .tile.t24 .tile-mono { font-size: 11px; }
.wk-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--line); margin-top: 10px; }
.sec-tools { display: inline-flex; gap: 12px; }
.sort.on { color: var(--brand); }
.fcount { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--brand); color: var(--on-brand); font-size: 11px; }
.fchips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: var(--space-3); }
.fchips .chip { height: 32px; font-size: 13px; }
.chip.dashed { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-strong); color: var(--ink-muted); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.toast .grow { min-width: 0; }
.toast-act { flex: none; height: 32px; padding: 0 10px; margin: -6px -8px -6px 0; border-radius: 8px; color: var(--brand-soft); font-weight: 700; font-size: 14px; }
[data-theme$="light"] .toast-act { color: #8fe8d9; }
[data-theme$="dark"] .toast-act { color: var(--brand); }
.phone.tb-hidden .tabbar { transform: translateY(100%); }
.phone.tb-hidden .fab { bottom: 40px; }
.phone.tb-hidden .home-ind { background: var(--ink); }
.worth { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.worth-o { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px; border-radius: var(--radius-md); background: var(--surface-2); color: var(--ink-muted); font-size: 12px; font-weight: 600; text-align: center; line-height: 15px; }
.worth-o.on { background: var(--brand-soft); color: var(--on-brand-soft); box-shadow: inset 0 0 0 2px var(--brand); }
.worth-o.on.w-no { background: var(--danger-soft); color: var(--danger); box-shadow: inset 0 0 0 2px var(--danger); }
.worth-o.on.w-unsure { background: var(--warning-soft); color: var(--warning-ink); box-shadow: inset 0 0 0 2px var(--warning); }
.worth-c { font-size: 14px; font-weight: 600; color: var(--ink-muted); }
.worth-c.w-yes { color: var(--success); } .worth-c.w-no { color: var(--danger); } .worth-c.w-unsure { color: var(--warning-ink); }
.success-t { color: var(--success); }
.add-row { display: flex; gap: 8px; align-items: center; }
.grow-in { flex: 1; min-width: 0; }
.pause-tl { position: relative; margin: var(--space-5) 0 var(--space-2) 6px; padding-left: 22px; display: flex; flex-direction: column; gap: 14px; }
.pause-tl::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.pt-i { position: relative; display: flex; flex-direction: column; gap: 2px; font-size: 15px; }
.pt-i::before { content: ""; position: absolute; left: -22px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface-sheet); box-shadow: inset 0 0 0 2px var(--line-strong); }
.pt-i.on::before { background: var(--brand); box-shadow: none; }
.src { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; font-size: 12px; color: var(--ink-muted); font-weight: 500; }
.src u { color: var(--brand); text-decoration: none; font-weight: 600; }
.cb { padding: 8px 0; }
.cb-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.cb-bar { display: block; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.cb-bar i { display: block; height: 100%; border-radius: 4px; background: var(--brand); }
.cb.near .cb-bar i { background: var(--warning); }

.worth-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: var(--space-3); }
.ws { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border-radius: var(--radius-md); background: var(--surface-2); }
.ws b { font-size: 20px; line-height: 24px; }
.ws.w-yes svg { color: var(--success); } .ws.w-unsure svg { color: var(--warning-ink); } .ws.w-no svg { color: var(--danger); }
.nw { display: flex; align-items: center; gap: 12px; padding-top: var(--space-3); border-top: 1px solid var(--line); }
.nw .grow { gap: 2px; }
.ins-sum .ins-h { align-items: center; margin-bottom: 6px; }
.fore { padding: 6px var(--space-4); }
.fo-row { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.fo-row + .fo-row { border-top: 1px solid var(--line); }
.per-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.per { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: var(--radius-md); background: var(--surface-2); }
.per.on { background: var(--brand-soft); } .per.on .title-sm, .per.on .meta { color: var(--on-brand-soft); }
.ctile { flex: none; display: grid; place-items: center; border-radius: 10px; background: color-mix(in srgb, var(--c) 18%, var(--surface)); color: var(--c); }
[data-theme$="dark"] .ctile { background: color-mix(in srgb, var(--c) 30%, var(--surface)); color: color-mix(in srgb, var(--c) 45%, #ffffff); }
.cat-prev { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.lbl-big { width: 32px; height: 32px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--c); color: #fff; }
.emo.on { box-shadow: inset 0 0 0 2px var(--brand); background: var(--brand-soft); color: var(--on-brand-soft); }
.emo svg { color: var(--ink); } .emo.on svg { color: var(--on-brand-soft); }
.pro { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; margin-left: 6px; border-radius: 5px; background: var(--ink); color: var(--bg); font-size: 10px; font-weight: 800; letter-spacing: .06em; vertical-align: 1px; }
.soon { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: var(--radius-full); background: var(--surface-2); color: var(--ink-muted); font-size: 12px; font-weight: 600; white-space: nowrap; flex: none; }
.pro-card { padding: var(--space-5); border-radius: var(--radius-lg); background: var(--brand); color: var(--on-brand); }

.pro-card h2 { margin: 0 0 6px; }
.ref-chip { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; margin-top: 4px; height: 20px; padding: 0 7px 0 5px; border-radius: var(--radius-full); background: var(--warning-soft); color: var(--warning-ink); font-size: 11px; font-weight: 600; }
.sh-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }

.bottom-bar.col { display: flex; flex-direction: column; gap: 4px; padding-bottom: 30px; }
.bottom-bar.col .btn-text { height: 40px; }
.scan { padding-bottom: 200px; }
.scan-art { position: relative; display: flex; justify-content: center; gap: 14px; padding: var(--space-5) 0 var(--space-4); }
.shot { width: 104px; height: 170px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow-card), 0 0 0 1px var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 10px; transform: rotate(-4deg); }

.sh-bar { display: block; width: 60%; height: 8px; border-radius: 4px; background: var(--line); margin-bottom: 4px; }
.sh-row { display: flex; align-items: center; gap: 6px; }

.scan-badge { position: absolute; bottom: 8px; left: 50%; margin-left: -26px; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: var(--on-brand); box-shadow: var(--shadow-float); }
.scan-art.reading .scan-line { position: absolute; left: 22%; right: 22%; top: 46%; height: 3px; border-radius: 2px; background: var(--brand); box-shadow: 0 0 16px 4px color-mix(in srgb, var(--brand) 55%, transparent); animation: sn-scan 1.6s ease-in-out infinite alternate; }

.steps { list-style: none; margin: var(--space-3) 0 var(--space-4); padding: 0; display: flex; flex-direction: column; gap: 14px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; }
.steps .grow { gap: 2px; }
.st-n { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--brand-soft); color: var(--on-brand-soft); font-weight: 700; font-size: 14px; }

.res-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: var(--space-5) var(--space-4) var(--space-2); }

.wg-lh { display: flex; justify-content: space-between; align-items: flex-start; }

.wg-list.big { gap: 10px; justify-content: flex-start; display: flex; flex-direction: column; }

<style>
/* ---------- viewer chrome (uses the same tokens) ---------- */
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
* { box-sizing: border-box; }
.vw-top { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 24px; background: var(--surface); box-shadow: 0 1px 0 var(--line); }
.vw-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
.vw-brand img { width: 32px; height: 32px; border-radius: 8px; }
.vw-tabs { display: flex; gap: 4px; }
.vw-tabs button { height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink-muted); }
.vw-tabs button.on { background: var(--brand-soft); color: var(--on-brand-soft); }
.vw-ctl { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.vw-ctl .seg-mini button { min-width: 0; }
.vw-ctl label { font-size: 12px; color: var(--ink-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.vw-link { font-size: 13px; font-weight: 600; color: var(--brand); text-decoration: none; white-space: nowrap; }
.vw-body { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 60px); }
.vw-nav { position: sticky; top: 60px; align-self: start; height: calc(100vh - 60px); overflow-y: auto; padding: 16px 12px 40px; border-right: 1px solid var(--line); }
.vw-nav h4 { margin: 16px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-muted); }
.vw-nav a { display: block; padding: 6px 8px; border-radius: 8px; font-size: 13px; line-height: 18px; color: var(--ink); text-decoration: none; }
.vw-nav a:hover { background: var(--surface-2); }
.vw-main { padding: 24px 32px 80px; min-width: 0; }
.vw-main h2.grp { margin: 32px 0 8px; font-size: 22px; }
.vw-card { margin: 16px 0 40px; scroll-margin-top: 80px; }
.vw-card h3 { margin: 0 0 4px; font-size: 16px; }
.vw-card .vw-notes { max-width: 860px; margin: 0 0 14px; font-size: 13px; line-height: 19px; color: var(--ink-muted); }
.vw-pair { display: flex; gap: 32px; flex-wrap: wrap; }
.vw-ph { display: flex; flex-direction: column; gap: 8px; min-height: 860px; }
.vw-ph > span { font-size: 12px; font-weight: 600; color: var(--ink-muted); }
.vw-ph .slot { background: transparent; }
.vw-comp { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 900px; }
.vw-proto { max-width: 900px; border-radius: 20px; box-shadow: 0 0 0 1px var(--line); background: var(--bg); }
.tok-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.tok { display: flex; gap: 12px; padding: 12px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-card); font-size: 12px; line-height: 17px; }
.tok .sw2 { display: flex; flex-direction: column; gap: 4px; flex: none; }
.tok .sw2 i { display: block; width: 44px; height: 26px; border-radius: 6px; box-shadow: inset 0 0 0 1px #00000022; }
.tok b { font-size: 13px; } .tok code { font-size: 11px; color: var(--ink-muted); }
.tok-tbl { width: 100%; max-width: 900px; border-collapse: collapse; font-size: 13px; }
.tok-tbl td, .tok-tbl th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tok-tbl th { color: var(--ink-muted); font-size: 12px; }
.vw-intro { max-width: 860px; font-size: 14px; line-height: 21px; color: var(--ink-muted); }
@media (max-width: 900px) { .vw-body { grid-template-columns: 1fr; } .vw-nav { display: none; } .vw-comp { grid-template-columns: 1fr; } }
</style>
</head>

  var ph = host.querySelector('.proto-phone');
  var idx = function (id) { return f.steps.map(function (x) { return x.id; }).indexOf(id); };

    });

W in v2.** §4.8 Header ‘November: ≈ $116.57’ (real money this month). Days show up to 3 mini logo marks (solid = paid, outlined = expected, amber = waiting). The selected day lists rows with price + cycle chip — the fix for ‘is this monthly or yearly?’.", "fixedLang": false}, {"id": "V2CalendarList", "group": "4.8 Calendar", "title": "Calendar — list (agenda)", "expr": "SCR.calendar({ view: 'agenda' })", "scroll": null, "notes": "**NEW in v2.** Timeline: to confirm, this week, later in November, December — every price with its cycle chip.", "fixedLang": false}, {"id": "V2CalendarPast", "group": "4.8 Calendar", "title": "Calendar — October (past)", "expr": "SCR.calendar({ month: 9, sel: 12 })", "scroll": null, "notes": "**NEW in v2.** A past month shows real payments.", "fixedLang": false}, {"id": "V2Insights", "group": "4.9 Insights", "title": "Insights — November: cost, 12 bars", "expr": "SCR.insights()", "scroll": null, "notes": "**NEW in v2.** §4.9 Month | Year and ‹ November 2026 ›: every card follows. Cost of November with change, n subscriptions, ≈ per day and Paid / Still to pay; bars for each month of 2026 (selected in `brand`, future hatched).", "fixedLang": false}, {"id": "V2InsightsCat", "group": "4.9 Insights", "title": "Insights — by category + most expensive", "expr": "SCR.insights()", "scroll": ".c-cat", "notes": "**NEW in v2.** Donut with % and amounts for the selected month; top 5 with price + cycle chip and the share of the month.", "fixedLang": false}, {"id": "V2InsightsRise", "group": "4.9 Insights", "title": "Insights — price rises + next 12 months", "expr": "SCR.insights()", "scroll": ".c-rise", "notes": "**NEW in v2.** §4.9.5 ‘+$3.50 more a month than a year ago · $42.00 a year · Netflix changed the most’, rows with old → new and Review Netflix. §4.9.6 projected ≈ $1,618.83 vs last 12 months ≈ $1,544.22, ‘≈ +$74.61 a year’, split into new subscriptions, price rises, cancelled/paused, other.", "fixedLang": false}, {"id": "V2InsightsUp", "group": "4.9 Insights", "title": "Insights — coming up (13 weeks), budgets", "expr": "SCR.insights()", "scroll": ".c-up", "notes": "**NEW in v2.** §4.9.7 Coming up by week or month; §4.9.8 budgets per category, AI over budget in `danger`.", "fixedLang": false}, {"id": "V2InsightsSave", "group": "4.9 Insights", "title": "Insights — savings, worth it, hint", "expr": "SCR.insights()", "scroll": ".c-bud", "notes": "**NEW in v2.** §4.9.9–10 Savings from cancelled subscriptions, what dropping ‘Not worth it’ would save, and a gentle overlap hint.", "fixedLang": false}, {"id": "V2InsightsAug", "group": "4.9 Insights", "title": "Insights — August (past month)", "expr": "SCR.insights({ m: 7 })", "scroll": null, "notes": "**NEW in v2.** A past month: the bar shows Paid and Not paid only; Netflix still at $15.49.", "fixedLang": false}, {"id": "V2InsightsDec", "group": "4.9 Insights", "title": "Insights — December (projected)", "expr": "SCR.insights({ m: 11 })", "scroll": null, "notes": "**NEW in v2.** A future month gets the ‘Projected’ tag; Disney+ drops out after its pause.", "fixedLang": false}, {"id": "V2InsightsYear", "group": "4.9 Insights", "title": "Insights — Year 2026", "expr": "SCR.insights({ year: true })", "scroll": null, "notes": "**NEW in v2.** Year mode: 12 months added up, ≈ per month, bars = the 12 months.", "fixedLang": false}, {"id": "V2InsightsMonths", "group": "4.9 Insights", "title": "Insights — coming up by month", "expr": "SCR.insights({ weeks: false })", "scroll": ".c-up", "notes": "**NEW in v2.** Coming up by month: Feb and Mar peak with Canva and Google One renewals.", "fixedLang": false}, {"id": "V2InsightsCategory", "group": "4.9 Insights", "title": "Insights — tap a slice: Video", "expr": "SCR.category()", "scroll": null, "notes": "**NEW in v2.** Tapping a donut slice lists that category's subscriptions for the month.", "fixedLang": false}, {"id": "V2InsightsForecastList", "group": "4.9 Insights", "title": "Insights — next 12 months as a list", "expr": CR.scan('reading')", "scroll": null, "notes": "**CHANGED in v2.** Progress with matches streaming in.", "fixedLang": false}, {"id": "V2ScanCamera", "group": "4.11 Scan (Pro)", "title": "Scan — photograph a receipt", "expr": "SCR.scan('camera')", "scroll": null, "notes": "**CHANGED in v2.** Camera with a receipt frame.", "fixedLang": false}, {"id": "V2ScanResults", "group": "4.11 Scan (Pro)", "title": "Scan — results: added 4, confirmed 1", "expr": "SCR.scan('results')", "scroll": null, "notes": "**CHANGED in v2.** Added (tagged Auto) and Confirmed, each with Undo.", "fixedLang": false}, {"id": "V2ScanReview", "group": "4.11 Scan (Pro)", "title": "Scan — needs your check / different amount / not added", "expr": "SCR.scan('results')", "scroll": ".review", "notes": "**CHANGED in v2.** The three groups from §4.11.", "fixedLang": false}, {"id": "V2ScanUndone", "group": "4.11 Scan (Pro)", "title": "Scan — one row undone", "expr": "SCR.scan('undone')", "scroll": null, "notes": "**NEW in v2.** Undo removes the row; the snackbar says it won't be added again.", "fixedLang": false}, {"id": "V2ScanNothing", "group": "4.11 Scan (Pro)", "title": "Scan — nothing found", "expr": "SCR.scan('nothing')", "scroll": null, "notes": "**CHANGED in v2.** Tips to take a readable screenshot.", "fixedLang": false}, {"id": "V2WidgetsIOS", "group": "4.12–4.13 Widgets & notifications", "title": "Widgets — iOS small and medium", "expr": "SCR.widgets('ios')", "scroll": null, "notes": "**NEW in v2.** §4.12 Small: the next payment with logo, price + cycle chip and days left. Medium: month cost + the next 3 payments.", "fixedLang": false}, {"id": "V2WidgetsLarge", "group": "4.12–4.13 Widgets & notifications", "title": "Widgets — large, iOS and Android", "expr": "SCR.widgets('large')", "scroll": null, "notes": "**NEW in v2.** Large: month cost, paid / still to pay and the next 6 payments, each with its cycle chip.", "fixedLang": false}, {"id": "V2WidgetsAndroid", "group": "4.12–4.13 Widgets & notifications", "title": "Widgets — Android small and medium", "expr": "SCR.widgets('android')", "scroll": null, "notes": "**NEW in v2.** The same content in Material You shapes.", "fixedLang": false}, {"id": "V2WidgetStates", "group": "4.12–4.13 Widgets & notifications", "title": "Widgets — to confirm, empty, PIN locked", "expr": "SCR.widgetStates()", "scroll": null, "notes": "**NEW in v2.** Waiting payment, no data, and the PIN-locked state that hides everything.", "fixedLang": false}, {"id": "V2Notifications", "group": "4.12–4.13 Widgets & notifications", "title": "Notifications — reminder, trial, due today, backup error", "expr": "SCR.lock()", "scroll": null, "notes": "**CHANGED in v2.** §4.13 text samples; plain text, no action buttons; backup only notifies on failure.", "fixedLang": false}], "comps": [{"id": "BannerSnackbar", "title": "Banners and snackbar", "notes": "Banners: warning (waiting, trial), info (price notice, auto-detected), neutral (paused, discontinued, reminders off), success (saving). Snackbar: inverse surface above the tab bar, 6 s, with **Undo** after anything the app did on its own."}, {"id": "Chips", "title": "Cycle chip, change chip, tags, reference price, projected", "notes": "**NEW in v2.** The **cycle chip** answers the top user complaint (‘is this per month or per year?’): an outlined 18px chip, 11px semibold `ink-muted`, under or beside every price — Overview rows and strip, Calendar, To confirm, Library (‘from $8.99’), Detail, widgets. Text: Weekly · Monthly · Quarterly · Yearly · Every N days/weeks/months. The `on` variant (24px, `brand`) is used in Detail.\n\n**Change chip:** ↓ + amount on `success-soft` for less, ↑ on `warning-soft` for more (never red; the arrow and sign carry meaning without colour)."}, {"id": "Controls", "title": "Buttons, segmented control, chips, toggle, stepper", "notes": "Buttons: primary, tonal, outline, text, danger; regular 48 and small 36 (48dp touch target kept with padding). Segmented control: 2-up for Monthly | Yearly cost, 4-up with counts for the list. Chips for choices (selected = `brand-soft` + check), an outlined add-chip. Toggle and stepper."}, {"id": "CostCard", "title": "Cost card — Monthly | Yearly, change, ≈ total, per day, Paid / Still to pay, 6 months", "notes": "**NEW in v2 — the Overview hero.** Segmented Monthly cost | Yearly cost (numbers count up in 200 ms when switching), change chip vs last month, ≈ total in `display` with an (i) button, ‘10 active subscriptions · ≈ $4.83 a day’, then the real money of the month: Paid (solid `brand`) and Still to pay (`brand` hatched 135° — readable without colour), the month range, and 6 month columns with this month in `brand` (tap → Insights on that month). Yearly mode: total of the year, ≈ per month, 12 columns with future months hatched."}, {"id": "EmptyAndTabBar", "title": "Empty state, tab bar", "notes": "Empty state with the nest illustration, one line and one action. Tab bar: Overview · Calendar · Insights · Settings; can hide while scrolling (setting)."}, {"id": "PaidBarMonthPicker", "title": "Paid / Still to pay bar, month picker ‹ ›, 12-month bars", "notes": "The paid/remaining bar uses two flex segments with a 3px gap; the remaining one is hatched so it still reads in greyscale. Month picker: Month | Year mini segment and ‹ November 2026 › (‘Projected’ tag on future months). Bars: one per month, the selected one `brand`, future months hatched with an outline."}, {"id": "PriceHistoryRow", "title": "Price history timeline", "notes": "**NEW in v2.** One row per change: ↑ on `warning-soft` / ↓ on `success-soft`, ‘$15.49 → $17.99’, date and source (You changed it · Library update · From past payments), the difference with sign. A change that starts at the next payment has a dashed marker. Empty: ‘The price has never changed.’"}, {"id": "PriceRiseNext12", "title": "Price rises card, next 12 months card", "notes": "**NEW in v2.** Price rises: ‘+$3.50 more a month than a year ago’, ‘$42.00 a year · Netflix changed the most’, rows old → new + the monthly difference, **Review Netflix**. Next 12 months: projected vs last 12 months as two bars (projected hatched), the difference in one sentence, and a breakdown that always adds up — new subscriptions, price rises, cancelled or paused, other."}, {"id": "ServiceLogo", "title": "Logo plate — library, custom monogram, user photo; 24/32/40/56/80; badges", "notes": "**NEW in v2 — replaces the v13 monogram tile.** One squircle (radius 28%) at 24 · 32 · 40 · 56 · 80.\n\n- **Library service:** the real logo, bundled in the app, sits at 64% of the plate on a soft tint of the brand colour — `color-mix(brand colour 13%, surface)` in light, 26% in dark, with a 1px ring of the brand colour at 22%. This keeps black, white and transparent logos readable in both themes and gives ten logos side by side an even rhythm. **The mocks show a stand-in mark (initials in the brand colour) where the bundled logo goes; Claude can't draw the real trademarks.**\n- **Custom service:** monogram (1–2 letters or an emoji) in white on the solid colour picked from the 12-colour palette.\n- **User photo:** fills the same squircle, cropped square.\n- Corner badges 18px (22px at 56+): hourglass on `warning-soft` (trial), clock on `warning` (waiting), pause on `surface-2`. Cancelled = greyscale 55%."}, {"id": "SheetDialog", "title": "Bottom sheet and dialog", "notes": "Bottom sheet: `surface-sheet`, 28px top corners, grabber, slides up in 240 ms over the scrim. Dialog: only for consequences (price from next payment, delete, confirm all, restore, erase)."}, {"id": "SubscriptionRow", "title": "Subscription row — states", "notes": "**CHANGED in v2.** Logo 40 with corner badge · name + tags (TRIAL, Auto, To confirm) · ‘6 days left · 15 Nov · Visa’ · first label (+N) · thin period progress bar (amber when waiting) · right: price in its own currency with ↑ when it rose in the last 90 days, the cycle chip, ≈ in your currency, ÷N for shared plans. Waiting rows get a warning tint, due-today a brand tint, paused/cancelled fade to 55%."}, {"id": "TrialAndNotice", "title": "Trial card (3 buttons), to-confirm card, price notice card", "notes": "**NEW in v2.** Trial card: hourglass, ‘Spotify trial ends in 3 days’, ‘Then $11.99 on 13 Nov’ + cycle chip, a `success-soft` line with what cancelling saves a year, and three buttons — **Keep it** (primary: hides the card for this trial, reminders stay), **View** (detail) and **How to cancel** (provider link; hidden when there's none). Several trials scroll sideways. Price notice card: old → new price, your share, Update / Keep old price."}, {"id": "UpcomingStrip", "title": "Upcoming payments strip", "notes": "**NEW in v2** (merges the v13 ‘Due this week’ card): 118px cards — logo, name, price + cycle chip, time left. A waiting payment leads, tinted `warning-soft`, with a quick ✓; due-today cards get a `brand` ring and the same ✓."}], "protos": [{"id": "Proto01FirstRun", "title": "Flow 1 — first run", "flow": "first", "notes": "Clickable prototype of product.md v2 §5 flow 1. Tap the dashed control, or jump with the step list; switch light/dark and English/Tiếng Việt beside it."}, {"id": "Proto02Add", "title": "Flow 2 — add Netflix, split with 4", "flow": "add", "notes": "Clickable prototype of product.md v2 §5 flow 2. Tap the dashed control, or jump with the step list; switch light/dark and English/Tiếng Việt beside it."}, {"id": "Proto03Custom", "title": "Flow 3 — custom service with a photo", "flow": "custom", "notes": "Clickable prototype of product.md v2 §5 flow 3. Tap the dashed control, or jump with the step list; switch light/dark and English/Tiếng Việt beside it."}, {"id": "Proto04Confirm", "title": "Flow 4 — confirm from a notification", "flow": "confirm", "notes": "Clickable prototype of product.md v2 §5 flow 4. Tap the dashed control, or jump with the step list; switch light/dark and English/Tiếng Việt beside it."}, {"id": "Proto05Trial", "title": "Flow 5 — trial card: keep, view, cancel"   }, { rootMargin: '600px' });
  function screensTab() {
    var h = '<p class="vw-intro">Every screen and state of product.md v2 §4 at 390 × 844, light and dark side by side, rendered live from the design system. Each card note says whether it is NEW, CHANGED or KEPT compared with v13. Use the toolbar for Tiếng Việt (VND sample data), the 360 frame and larger text. Service logos are stand-in marks on the logo plate — the app uses the bundled real logos.</p>';
    var n = '', last = '';
    DATA.screens.forEach(function (s) {
      if (s.group !== last) { h += '<h2 class="grp" id="g-' + s.id + '">' + s.group + '</h2>'; n += '<h4>' + s.group + '</h4>'; last = s.group; }
      h += '<section class="vw-card" id="' + s.id + '"><h3>' + esc(s.title) + '</h3><p class="vw-notes">' + md(s.notes) + '</p><div class="vw-pair">' +
        ['light', 'dark'].map(function (m) { return '<div class="vw-ph"><span>' + (s.fixedLang ? (m === 'light' ? 'Light · English' : 'Dark · Tiếng Việt') : (m === 'light' ? 'Light' : 'Dark')) + '</span><div class="slot" data-id="' + s.id + '" data-mode="' + m + '"></div></div>'; }).join('') + '</div></section>';
      n += '<a href="#' + s.id + '">' + esc(s.title) + '</a>';
    });
    main.innerHTML = h; nav.innerHTML = n;
    main.querySelectorAll('.slot').forEach(function (el) { io.observe(el); });
  }
  function protoTab() {
    var h = '<p class="vw-intro">The 11 flows of product.md v2 §5. Tap the dashed control on the phone, or jump with the step list. Each flow has its own light/dark and English/Tiếng Việt switch.</p>', n = '<h4>Flows</h4>';
    DATA.protos.forEach(function (p) { h += '<section class="vw-card" id="' + p.id + '"><h3>' + esc(p.title) + '</h3><p class="vw-notes">' + md(p.notes) + '</p><div class="vw-proto" data-flow="' + p.flow + '"></div></section>'; n += '<a href="#' + p.id + '">' + esc(p.title.split(' — ')[0]) + '</a>'; });
    main.innerHTML = h; nav.innerHTML = n;
    main.querySelectorAll('.vw-proto').forEach(function (el) { S.proto(el.dataset.flow, el); });
  }
  function compsTab() {
    var h = '', n = '<h4>Components</h4>';
    DATA.comps.forEach(function (c) {
      h += '<section class="vw-card" id="' + c.id + '"><h3>' + c.id + ' <span class="meta muted">' + esc(c.title) + '</span></h3><p class="vw-notes">' + md(c.notes) + '</p><div class="vw-comp">' +
        ['light', 'dark'].map(function (m) { return '<div class="cpane" data-theme="' + m + '" data-c="' + c.id + '"></div>'; }).join('') + '</div></section>';
      n += '<a href="#' + c.id + '">' + c.id + '</a>';
    });
    main.innerHTML = '<div class="cpanes" style="display:block;padding:0">' + h + '</div>'; nav.innerHTML = n;
    main.querySelectorAll('.cpane').forEach(function (p) { p.innerHTML = COMP_FNS[p.dataset.c](); S.wire(p); });
  }
  function tokensTab() {
    var T = DATA.tokens, h = '<h2 class="grp" id="t-color">Colour</h2><p class="vw-intro">Each swatch: light (top) and dark (bottom). Text pairs meet WCAG AA in both themes; see the design system README for usage rules.</p><div class="tok-grid">' +
      T.color.map(function (c) { return '<div class="tok"><span class="sw2"><i style="background:' + c.light + '"></i><i style="background:' + c.dark + '"></i></span><span><b>' + c.name + '</b><br><code>' + c.light + ' / ' + c.dark + '</code><br>' + esc(c.usage) + '</span></div>'; }).join('') + '</div>';
    h += '<h2 class="grp" id="t-type">Type — Be Vietnam Pro</h2><table class="tok-tbl"><tr><th>Style</th><th>Size / line</th><th>Weight</th><th>Sample</th></tr>' +
      T.type.map(function (s) { return '<tr><td><b>' + s.name + '</b><br><span class="meta muted">' + esc(s.usage || '') + '</span></td><td class="num">' + s.fontSize + ' / ' + s.lineHeight + '</td><td>' + s.fontWeight + '</td><td><span style="font-size:' + s.fontSize + ';line-height:' + s.lineHeight + ';font-weight:' + s.fontWeight + ';letter-spacing:' + s.letterSpacing + ';font-variant-numeric:tabular-nums">' + esc(s.sample) + '</span></td></tr>'; }).join('') + '</table>';
    ['spacing', 'radius', 'size', 'shadow'].forEach(function (k) {
      h += '<h2 class="grp" id="t-' + k + '">' + k[0].toUpperCase() + k.slice(1) + '</h2><table class="tok-tbl"><tr><th>Token</th><th>Value</th><th>Usage</th></tr>' +
        T[k].map(function (t) { var v = typeof t.value === 'string' ? t.value : 'light: ' + t.value.light + '<br>dark: ' + t.value.dark; return '<tr><td><b>' + t.name + '</b></td><td><code>' + v + '</code></td><td>' + esc(t.usage || '') + '</td></tr>'; }).join('') + '</table>';
    });
    main.innerHTML = h; nav.innerHTML = '<h4>Tokens</h4>' + ['color', 'type', 'spacing', 'radius', 'size', 'shadow'].map(function (k) { return '<a href="#t-' + k + '">' + k + '</a>'; }).join('');
  }
  var TABS = { screens: screensTab, proto: protoTab, comps: compsTab, tokens: tokensTab };
  function go() { window.scrollTo(0, 0); TABS[st.tab](); }
  document.querySelectorAll('#tabs button').forEach(function (b) { b.onclick = function () { document.querySelectorAll('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); }); st.tab = b.dataset.t; go(); }; });
  document.querySelectorAll('#ctl .seg-mini').forEach(function (g) {
    g.querySelectorAll('button').forEach(function (b) { b.onclick = function () {
      g.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      var k = g.dataset.k, v = b.dataset.v;
      if (k === 'page') { document.documentElement.setAttribute('data-theme', v); return; }
      st[k] = k === 'lang' ? v : +v;
      if (st.tab === 'screens') { var y = window.scrollY; screensTab(); window.scrollTo(0, y); }
    }; });
  });
  if (location.hash) { setTimeout(function () { var el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }, 50); }
  go();
})();
</script>
</body>
</html>
